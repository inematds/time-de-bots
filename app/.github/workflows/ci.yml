name: Check core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
